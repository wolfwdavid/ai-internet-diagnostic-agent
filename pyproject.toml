[project]
name = "ai-internet-diagnostic-agent"
version = "0.4.0"
description = "Cross-platform local agent for AI Internet Diagnostic — collectors land in Phase 4."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
authors = [{ name = "WolfDavid", email = "mkarurosun@gmail.com" }]
dependencies = [
    # D-13: pin the wire schema (range during dev; Phase 4 / 5 may pin to == once stable)
    "wifi-diag-schema>=1.1.0,<2.0.0",
    # Cross-OS baseline (PROJECT.md TL;DR table) — kept minimal; full set lands in Phase 4
    "psutil>=7.0",
    "icmplib>=3.0",
    "httpx>=0.28",
    "tenacity>=9.0",
    "platformdirs>=4.0",
    "rich>=13.0",
    "typer>=0.15,<1.0",
    "huggingface_hub>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
    "hypothesis>=6.120",
    "freezegun>=1.5",
]

# Per-OS extras — Phase 4 will populate; declared here so the package layout is stable.
windows = [
    # Phase 4 will add: "pywin32>=308", "wmi>=1.5"
]
macos = [
    # Phase 4 will add: "pyobjc-framework-CoreWLAN"
]
linux = [
    # Phase 4 will add: "dbus-next" (or "pydbus"), "systemd-python"
]

[project.scripts]
agent = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv.sources]
# Local dev: resolve wifi-diag-schema from the sibling repo while v1.0.0 is
# still pre-PyPI. CI swaps to the PyPI release after the schema repo's first
# tag push. Mirrors the same pattern used in the model and Space repos.
wifi-diag-schema = { path = "../wifi-diag-schema", editable = true }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true  # standard mode per D-16
