[project]
name = "ai-internet-diagnostic-agent"
version = "0.4.0"
description = "Cross-platform local agent for AI Internet Diagnostic — collectors land in Phase 4."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
authors = [{ name = "WolfDavid", email = "mkarurosun@gmail.com" }]
dependencies = [
    # D-13: pin the wire schema (range during dev; Phase 4 / 5 may pin to == once stable)
    "wifi-diag-schema>=1.1.0,<2.0.0",
    # Cross-OS baseline (PROJECT.md TL;DR table) — kept minimal; full set lands in Phase 4
    "psutil>=7.0",
    "icmplib>=3.0",
    "httpx>=0.28",
    "gradio_client>=1.13,<2.0",
    "tenacity>=9.0",
    "platformdirs>=4.0",
    "rich>=13.0",
    "typer>=0.15,<1.0",
    "huggingface_hub>=0.27,<1.0",
    # Plan 04-06: local-only inference stack (AGENT-05, AGENT-06)
    # Pins match the model repo's pyproject so the vendored predict_verdict
    # body sees the same library versions it was trained against.
    "scikit-learn>=1.8,<2.0",
    "lightgbm>=4.6,<5.0",
    "pyod>=2.0,<3.0",
    "joblib>=1.4",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    # Templated narrator (LLM-FREE; the [llm] extra is intentionally NOT pulled).
    # Bumped 06-03: v0.1.0 tag predated the public-API re-exports; v0.1.1 is the first
    # PyPI release with `from wifi_diag_narrator import narrate_templated, ...` working.
    "wifi-diag-narrator>=0.1.1,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
    "hypothesis>=6.120",
    "freezegun>=1.5",
]

# Per-OS extras — Phase 4 will populate; declared here so the package layout is stable.
windows = [
    # Plan 04-02: WLAN-AutoConfig event log via pywin32 (D-PRIV-03 scope).
    # wmi is NOT added at v1 — D-PRIV-03 keeps Win event-log scope to WLAN-AutoConfig only.
    "pywin32>=308; sys_platform == 'win32'",
]
macos = [
    # Plan 04-03: CoreWLAN for BSSID/SSID/RSSI; CoreLocation gated by agent doctor for
    # Location-Services detection (D-PRIV-04 default = `log show` non-sudo; `wdutil`
    # opt-in via `WIFI_DIAG_USE_WDUTIL=1` env var). pyobjc 10.3+ supports macOS 12+.
    "pyobjc-framework-CoreWLAN>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-CoreLocation>=10.3; sys_platform == 'darwin'",
]
linux = [
    # Plan 04-04: NetworkManager + wpa_supplicant via D-Bus (Pitfall 12 supported stack).
    # systemd-python NOT added at v1 — RESEARCH.md picks D-Bus first; journalctl
    # fallback deferred to v1.x.
    "dbus-next>=0.2.3; sys_platform == 'linux'",
]

[project.scripts]
agent = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

# Sibling-path editable overrides for wifi-diag-schema + wifi-diag-narrator
# were stripped in Phase 6 plan 06-03 once both packages reached PyPI
# (schema 1.1.0 / narrator 0.1.1). The agent now ships a pip-installable
# wheel that consumers can grab without a sibling repo checkout.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true  # standard mode per D-16
